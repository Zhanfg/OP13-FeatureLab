name: repository-audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repository policy audit
        run: sh tools/audit-repository.sh

      - name: Validate public schemas and examples
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          feature_schema = json.loads(Path('schemas/feature.schema.json').read_text())
          catalog = json.loads(Path('config/feature-catalog.example.json').read_text())
          feature_validator = Draft202012Validator(feature_schema)
          errors = []
          for index, feature in enumerate(catalog):
              for error in feature_validator.iter_errors(feature):
                  errors.append(f'feature[{index}] {error.json_path}: {error.message}')

          snapshot_schema = json.loads(Path('schemas/property-snapshot.schema.json').read_text())
          snapshot = json.loads(Path('config/property-snapshot.example.json').read_text())
          snapshot_validator = Draft202012Validator(snapshot_schema)
          for error in snapshot_validator.iter_errors(snapshot):
              errors.append(f'property snapshot {error.json_path}: {error.message}')

          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'validated {len(catalog)} feature definition(s) and property snapshot example')
          PYCODE

      - name: Run local generator and safety-audit tests
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          PYTHONPATH=src python3 -m compileall -q src tests

      - name: Run transactional mount fault-injection tests
        run: |
          for test_script in tests/runtime/test_*.sh; do
            sh "$test_script"
          done

      - name: Run staged property-controller tests
        run: |
          for test_script in tests/properties/test_*.sh; do
            sh "$test_script"
          done
