name: repository-audit

# Mainline gate: repository policy, public schemas, generator semantics,
# validation-module assembly, transactional mounts, and recovery-controlled properties.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repository policy audit
        run: sh tools/audit-repository.sh

      - name: Validate public schemas and examples
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          cases = [
              (
                  'feature catalog',
                  'schemas/feature.schema.json',
                  json.loads(Path('config/feature-catalog.example.json').read_text()),
                  True,
              ),
              (
                  'property snapshot',
                  'schemas/property-snapshot.schema.json',
                  json.loads(Path('config/property-snapshot.example.json').read_text()),
                  False,
              ),
              (
                  'compatibility profile',
                  'schemas/compatibility-profile.schema.json',
                  json.loads(Path('config/compatibility-profile.example.json').read_text()),
                  False,
              ),
          ]
          errors = []
          for label, schema_path, value, is_array in cases:
              schema = json.loads(Path(schema_path).read_text())
              validator = Draft202012Validator(schema)
              values = value if is_array else [value]
              for index, item in enumerate(values):
                  for error in validator.iter_errors(item):
                      location = f'[{index}]' if is_array else ''
                      errors.append(f'{label}{location} {error.json_path}: {error.message}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('validated feature catalog, property snapshot, and compatibility profile examples')
          PYCODE

      - name: Run local generator, assembler, and safety-audit tests
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          PYTHONPATH=src python3 -m compileall -q src tests

      - name: Run transactional mount fault-injection tests
        run: |
          for test_script in tests/runtime/test_*.sh; do
            sh "$test_script"
          done

      - name: Run staged property-controller tests
        run: |
          for test_script in tests/properties/test_*.sh; do
            sh "$test_script"
          done
