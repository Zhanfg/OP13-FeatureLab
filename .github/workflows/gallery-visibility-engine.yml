name: Gallery Visibility Engine

on:
  workflow_dispatch:
  push:
    branches:
      - exp/gallery-visibility-engine-v1.5.2-fastpath
    paths:
      - "experiments/gallery-visibility-engine/**"
      - ".github/workflows/gallery-visibility-engine.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/gallery-visibility-engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GalleryVisibilityEngine-1.5.2-alpha1
          path: experiments/gallery-visibility-engine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
