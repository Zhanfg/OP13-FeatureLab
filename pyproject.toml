[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "op13-featurelab"
version = "0.6.0"
description = "Local generator, private preflight analyzer, validation-module assembler, and semantic safety auditor for OP13 FeatureLab"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [{name = "OP13 FeatureLab contributors"}]
dependencies = []

[project.scripts]
op13-featurelab = "featurelab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
